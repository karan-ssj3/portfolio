<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karan Bhutani</title>
    <meta
      name="description"
      content="AI and Data Consultant at Deloitte. Building RAG systems, autonomous agents, and data platforms."
    />

    <!-- Font preconnect for Space Grotesk + Inter delivery. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Cloudflare Web Analytics beacon: only injected when VITE_CF_BEACON_TOKEN is set. -->
    <script type="module">
      const token = import.meta.env.VITE_CF_BEACON_TOKEN;
      if (token) {
        const s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.setAttribute('data-cf-beacon', JSON.stringify({ token }));
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
