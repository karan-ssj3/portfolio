name: Deploy site to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List changes without uploading anything (PRs always run as dry-run)'
        type: boolean
        default: false

# Serialize deploys: queue instead of cancelling an in-flight run.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          for f in dist/index.html dist/.htaccess; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required build artifact: $f"
              exit 1
            fi
          done

      - name: List FTP root and target dir (dry run only)
        if: ${{ env.DRY_RUN == 'true' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # TEMP DIAGNOSTIC - remove before merge
          curl -sv --ftp-pasv "ftp://$FTP_SERVER/" --user "$FTP_USERNAME:$FTP_PASSWORD" -o /dev/null 2>&1 | grep -E '^< (2|5)' | grep -viE 'pass|user' || true
          for d in "" "public_html/" "domains/" "domains/karanbhutani.com/" "domains/karanbhutani.com/public_html/"; do
            echo "=== /$d ==="
            curl -s --ftp-pasv --max-time 30 "ftp://$FTP_SERVER/$d" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | awk '{print $1, $NF}' | head -20 || echo "(failed)"
          done

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          dry-run: ${{ env.DRY_RUN == 'true' }}
          log-level: standard
